plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.moddev' version '2.0.141'
    id 'me.modmuss50.mod-publish-plugin' version '1.1.0'
}

def resolvedModVersion = mod_version.toString().endsWith("-SNAPSHOT")
        ? mod_version.toString().replace("-SNAPSHOT", "-" + new java.text.SimpleDateFormat("yyyyMMdd-HHmmss").format(new Date()) + "-SNAPSHOT")
        : mod_version.toString()
version = "${minecraft_version}-${resolvedModVersion}"
group = mod_group_id

base {
    archivesName = mod_id
}

java.toolchain.languageVersion = JavaLanguageVersion.of(21)

neoForge {
    version = neoforge_version

    parchment {
        mappingsVersion = "2024.11.17"
        minecraftVersion = "1.21.1"
    }

    runs {
        client {
            client()
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        server {
            server()
            programArgument '--nogui'
            systemProperty 'neoforge.enabledGameTestNamespaces', mod_id
        }

        data {
            data()
            programArguments.addAll '--mod', mod_id, '--all', '--output', file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
        }
    }

    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

sourceSets.main.resources { srcDir 'src/generated/resources' }

repositories {
    maven {
        name = "BlameJared"
        url = "https://maven.blamejared.com"
    }
    maven {
        name = "CurseForge"
        url = "https://cursemaven.com"
        content {
            includeGroup "curse.maven"
        }
    }
    maven {
        name = "Modrinth"
        url = "https://api.modrinth.com/maven"
        content {
            includeGroup "maven.modrinth"
        }
    }
}

dependencies {
    // JEI
    compileOnly "mezz.jei:jei-${minecraft_version}-common-api:${jei_version}"
    compileOnly "mezz.jei:jei-${minecraft_version}-neoforge-api:${jei_version}"
    runtimeOnly "mezz.jei:jei-${minecraft_version}-neoforge:${jei_version}"
}

tasks.named('processResources', ProcessResources).configure {
    var replaceProperties = [
            minecraft_version: minecraft_version,
            minecraft_version_range: minecraft_version_range,
            neoforge_version: neoforge_version,
            neoforge_version_range: neoforge_version_range,
            loader_version_range: loader_version_range,
            mod_id: mod_id,
            mod_name: mod_name,
            mod_license: mod_license,
            mod_version: mod_version,
            mod_authors: mod_authors,
            mod_description: mod_description
    ]

    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', 'pack.mcmeta']) {
        expand replaceProperties + [project: project]
    }
}

tasks.register('apiJar', Jar) {
    archiveClassifier.set('api')
    dependsOn tasks.named('classes')
    from(sourceSets.main.output) {
        include 'com/breakinblocks/nutritional/data/codec/**'
        include 'com/breakinblocks/nutritional/data/registry/**'
        include 'com/breakinblocks/nutritional/data/datamap/**'
        include 'com/breakinblocks/nutritional/attribute/**'
        include 'com/breakinblocks/nutritional/effect/**'
        include 'com/breakinblocks/nutritional/advancement/**'
        include 'com/breakinblocks/nutritional/common/InvertedNutrientIndex.class'
        include 'com/breakinblocks/nutritional/Nutritional.class'
        include 'com/breakinblocks/nutritional/util/NutritionalId.class'
        include 'com/breakinblocks/nutritional/util/HexColor.class'
        include 'com/breakinblocks/nutritional/util/NutritionalStreamCodecs.class'
    }
}

tasks.register('apiSourcesJar', Jar) {
    archiveClassifier.set('api-sources')
    from(sourceSets.main.allJava) {
        include 'com/breakinblocks/nutritional/data/codec/**'
        include 'com/breakinblocks/nutritional/data/registry/**'
        include 'com/breakinblocks/nutritional/data/datamap/**'
        include 'com/breakinblocks/nutritional/attribute/**'
        include 'com/breakinblocks/nutritional/effect/**'
        include 'com/breakinblocks/nutritional/advancement/**'
        include 'com/breakinblocks/nutritional/common/InvertedNutrientIndex.java'
        include 'com/breakinblocks/nutritional/Nutritional.java'
        include 'com/breakinblocks/nutritional/util/NutritionalId.java'
        include 'com/breakinblocks/nutritional/util/HexColor.java'
        include 'com/breakinblocks/nutritional/util/NutritionalStreamCodecs.java'
    }
}

tasks.named('assemble') {
    dependsOn 'apiJar', 'apiSourcesJar'
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
            artifact(tasks.named('apiJar'))
            artifact(tasks.named('apiSourcesJar'))
        }
    }
    repositories {
        maven {
            name = "BreakInBlocks"
            url = version.toString().endsWith("-SNAPSHOT") ?
                "https://maven.breakinblocks.com/snapshots" :
                "https://maven.breakinblocks.com/releases"
            credentials {
                username = System.getenv("MAVEN_USER") ?: ""
                password = System.getenv("MAVEN_TOKEN") ?: ""
            }
        }
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.compilerArgs << '-Xlint:deprecation'
}

publishMods {
    dryRun = project.hasProperty("dryRun") && project.property("dryRun") == "true"
    file = jar.archiveFile
    def changelogFile = file("metadata/changelogs/${mod_version}.md")
    changelog = changelogFile.exists() ? changelogFile.text : "Release ${version}"
    type = STABLE
    modLoaders.add("neoforge")

    if (project.curseforge_id?.trim()) {
        curseforge {
            projectId = project.curseforge_id
            accessToken = providers.environmentVariable("CURSEFORGE_TOKEN")
            minecraftVersions.add(minecraft_version)
            clientRequired = true
            serverRequired = true
            optional("jei")
        }
    }

    if (project.modrinth_id?.trim()) {
        modrinth {
            projectId = project.modrinth_id
            accessToken = providers.environmentVariable("MODRINTH_TOKEN")
            minecraftVersions.add(minecraft_version)
            optional("jei")
        }
    }
}

tasks.register('publishMaven') {
    description = 'Publishes the mod and API JARs to the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMavenJavaPublicationToBreakInBlocksRepository'
}

tasks.register('publishMod') {
    description = 'Publishes the mod to CurseForge and the BreakInBlocks Maven repository.'
    group = 'publishing'
    dependsOn 'publishMods', 'publishMaven'
}

afterEvaluate {
    def mavenTask = tasks.findByName('publishMavenJavaPublicationToBreakInBlocksRepository')
    if (mavenTask != null) {
        def originalActions = new ArrayList<>(mavenTask.actions)
        mavenTask.actions.clear()
        mavenTask.doLast('Tolerant Maven publish') {
            originalActions.each { action ->
                try {
                    action.execute(mavenTask)
                } catch (Exception e) {
                    logger.warn("Maven publish failed (continuing anyway): ${e.message}")
                }
            }
        }
    }
}
